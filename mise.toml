[tools]
bun = "1.4.4"
python = "3.12.11"
uv = "0.12.0"

[env]
UV_PYTHON_DOWNLOADS = "never"

[tasks.setup]
description = "Initialize the pinned upstream and install locked dependencies"
run = [
  "git submodule update --init --recursive",
  "uv sync --locked",
  "cd vendors/opencode && bun install --frozen-lockfile",
  # Adapter tests import upstream core's dependencies.
  "ln -sfn ../vendors/opencode/packages/core/node_modules tests/node_modules",
]

[tasks.verify]
description = "Verify the upstream pin, pristine submodule, and tool versions"
run = "uv run --locked python scripts/verify.py"

[tasks.check]
description = "Run the upstream canonical lint and type checks"
dir = "vendors/opencode"
run = "bun run check"

[tasks."test:location"]
description = "Run upstream's own location and session lifecycle tests, unadapted"
dir = "vendors/opencode/packages/core"
run = "bun run test test/location-activity.test.ts test/location-layer.test.ts test/session-execution.test.ts"

[tasks."test:adapters"]
description = "Run our adapter tests against upstream loaded through the adapters"
dir = "vendors/opencode/packages/core"
run = "bun run script/test.ts --preload {{config_root}}/tests/preload.ts {{config_root}}/tests"

[tasks."test:extensions"]
description = "Type-check, test and rebuild the OpenChamber extensions; their committed bundles must match their sources"
run = [
  "cd extensions/planner && bun install --frozen-lockfile && bun run check && bun test tests/ && bun run build",
  "cd extensions/vscode && bun install --frozen-lockfile && bun run check && bun test tests/ && bun run build",
  "git diff --exit-code -- extensions/planner/panel/main.js extensions/planner/service/main.js extensions/vscode/workbench/main.js extensions/vscode/panel/main.js extensions/vscode/service/main.js",
]

[tasks.ci]
description = "Run the same checks locally and in GitHub Actions (after setup)"
run = [
  "mise run verify",
  "mise run check",
  "mise run test:location",
  "mise run test:adapters",
  "mise run test:extensions",
]

[tasks.build]
description = "Rebuild one release target with adapters, e.g. `mise run build opencode-linux-x64`"
run = "uv run --locked python scripts/build.py"

[tasks."upstream:sync"]
description = "Pin the submodule to the official latest V2 release if it is newer"
run = "uv run --locked python scripts/vendors.py sync"

[tasks."vendors:sync"]
description = "Pin all vendors to their latest formal GitHub release tags"
run = "uv run --locked python scripts/vendors.py sync"

[tasks."release:notes"]
description = "Print release notes for the current pin and adapters"
run = "uv run --locked python scripts/upstream.py notes"
