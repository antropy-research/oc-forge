[tools]
bun = "1.4.4"
# OpenChamber's web build (scripts/build-openchamber.py) runs Vite under Node, as its releases do.
node = "24"
python = "3.12.11"
uv = "0.12.0"

[env]
UV_PYTHON_DOWNLOADS = "never"

[tasks.setup]
description = "Initialize the pinned upstream and install locked dependencies"
run = [
  "git submodule update --init --recursive",
  "uv sync --locked",
  "cd vendors/opencode && bun install --frozen-lockfile",
  # Adapter tests import upstream core's dependencies.
  "ln -sfn ../vendors/opencode/packages/core/node_modules tests/node_modules",
]

[tasks.verify]
description = "Verify the upstream pin, pristine submodule, and tool versions"
run = "uv run --locked python scripts/verify.py"

[tasks.check]
description = "Run the upstream canonical lint and type checks"
dir = "vendors/opencode"
run = "bun run check"

[tasks."test:location"]
description = "Run upstream's own location and session lifecycle tests, unadapted"
dir = "vendors/opencode/packages/core"
run = "bun run test test/location-activity.test.ts test/location-layer.test.ts test/session-execution.test.ts"

[tasks."test:adapters"]
description = "Run our adapter tests against upstream loaded through the adapters"
dir = "vendors/opencode/packages/core"
run = "bun run script/test.ts --preload {{config_root}}/tests/preload.ts {{config_root}}/tests"

[tasks."test:extensions"]
description = "Type-check, test and rebuild the OpenChamber extensions; their committed bundles must match their sources"
run = [
  # Each extension is a submodule, its own repository (antropy-research/openchamber-planner, -cloak-browser): the
  # bundles are checked inside it.
  "cd extensions/planner && bun install --frozen-lockfile && bun run check && bun test tests/ && bun run build",
  "git -C extensions/planner diff --exit-code -- panel/main.js service/main.js service/cli.js",
  # The Planner keeps the extension side of the host APIs, so it builds on its own: the same bytes as the adapters'.
  "cmp adapters/openchamber/client/index.ts extensions/planner/panel/lib/openchamber/ocforge/client/index.ts",
  "cmp adapters/openchamber/host/protocol.ts extensions/planner/panel/lib/openchamber/ocforge/host/protocol.ts",
  # Its tests drive a real Chromium (GitHub's Ubuntu runners have Google Chrome).
  "cd extensions/cloak-browser && bun install --frozen-lockfile && bun run check && bun run build && bun run test",
  "git -C extensions/cloak-browser diff --exit-code -- panel/main.js panel/frame.js service/main.js",
]

[tasks.ci]
description = "Run the same checks locally and in GitHub Actions (after setup)"
run = [
  "mise run verify",
  "mise run check",
  "mise run test:location",
  "mise run test:adapters",
  "mise run test:extensions",
]

[tasks.build]
description = "Rebuild one release target with adapters, e.g. `mise run build opencode-linux-x64`"
run = "uv run --locked python scripts/build.py"

[tasks."build:openchamber"]
description = "Build OpenChamber's web package from vendors/openchamber with the oc-forge adapters: dist/openchamber-web-<version>.tgz"
run = "uv run --locked python scripts/build-openchamber.py"

[tasks."check:openchamber"]
description = "Apply the OpenChamber adapters to vendors/openchamber and type-check the result, without building a package"
run = "uv run --locked python scripts/build-openchamber.py --check-only"

[tasks."vendors:update"]
description = "By hand: move vendors/ to the latest formal releases, then setup, CI checks and the OpenChamber adapters; commits the pins only if every step passes (`-- --abort` puts them back)"
run = "uv run --locked python scripts/update-vendors.py"

[tasks."release:notes"]
description = "Print release notes for the current pin and adapters"
run = "uv run --locked python scripts/upstream.py notes"
