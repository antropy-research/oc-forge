# OpenChamber, OpenCode and VS Code Server for the web, built from vendors/ at their pins, and the
# GitHub CLI, for extension development; see README.md. Build with ./build.sh.
name: oc-forge-openchamber-dev

services:
  openchamber:
    build:
      # The repository root, for vendors/, adapters/ and scripts/ (Dockerfile.dockerignore).
      context: ../..
      dockerfile: containers/openchamber-dev/Dockerfile
    image: oc-forge/openchamber-dev:vendors
    container_name: oc-forge-openchamber-dev
    init: true
    restart: unless-stopped
    ports:
      # Loopback by default; set OC_DEV_BIND in the untracked .env to publish
      # on another address, such as the host's Tailscale IP.
      - "${OC_DEV_BIND:-127.0.0.1}:${OC_DEV_PORT:-35310}:3000"
    env_file:
      # The UI password and provider API keys live outside the repository.
      - path: ${HOME}/.local/share/oc-forge-openchamber-dev/secrets.env
        required: true
    volumes:
      - home:/home/node
      - ../../extensions:/extensions

  # VS Code in the browser, on the same home volume (projects, worktrees) and extensions.
  vscode:
    build:
      context: ../..
      dockerfile: containers/openchamber-dev/Dockerfile
    image: oc-forge/openchamber-dev:vendors
    container_name: oc-forge-vscode-dev
    init: true
    restart: unless-stopped
    ports:
      - "${OC_DEV_BIND:-127.0.0.1}:${OC_VSCODE_PORT:-35311}:8000"
    env_file:
      # VSCODE_CONNECTION_TOKEN lives in the same secrets file as the UI password.
      - path: ${HOME}/.local/share/oc-forge-openchamber-dev/secrets.env
        required: true
    volumes:
      - home:/home/node
      - ../../extensions:/extensions
    # Without a token anyone who reaches the port would have a shell; refuse to start.
    command:
      - sh
      - -c
      - >-
        test -n "$$VSCODE_CONNECTION_TOKEN" || { echo 'Set VSCODE_CONNECTION_TOKEN in secrets.env' >&2; exit 1; };
        umask 077; printf %s "$$VSCODE_CONNECTION_TOKEN" > /tmp/vscode-token;
        exec vscode-server --host 0.0.0.0 --port 8000 --connection-token-file /tmp/vscode-token
        --server-data-dir /home/node/.vscode-server-web
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  home:
    name: oc-forge-openchamber-dev-home
