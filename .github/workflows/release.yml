name: Release

# Publishes every commit on main as the next `v<upstream>-fixed.N` (N restarts at 1
# for each new upstream version).
# Nothing is published unless tests and every target build pass.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build and release
        type: string
        required: true
      promote:
        description: Fast-forward main to `ref` before publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
          persist-credentials: false
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.18
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- uv run --locked python scripts/upstream.py plan
      - run: mise run setup
      - run: mise run ci

  build:
    needs: plan
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: opencode-linux-x64
            runner: ubuntu-24.04
          - target: opencode-darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.18
      - run: mise run setup
      - name: Build ${{ matrix.target }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run build ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.18
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Fast-forward main
        if: inputs.promote
        # Fails, and publishes nothing, if main moved since the sync started.
        run: git push origin "${{ needs.plan.outputs.sha }}:refs/heads/main"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS && cd ..
          mise exec -- uv run --locked python scripts/upstream.py notes > notes.md
          gh release create "${{ needs.plan.outputs.tag }}" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.plan.outputs.sha }}" \
            --title "${{ needs.plan.outputs.tag }}" \
            --notes-file notes.md
      # The repository keeps only dev, main and planner. The sync's pin commit is on main now, so its staging branch
      # goes, but only while it still points at this commit: a newer sync's commit stays.
      - name: Delete the sync's staging branch
        if: inputs.promote
        run: |
          if [ "$(git ls-remote origin refs/heads/upstream-sync | cut -f1)" = "${{ needs.plan.outputs.sha }}" ]; then
            git push origin --delete upstream-sync
          fi
