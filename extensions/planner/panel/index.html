<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Planner</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: var(--oc-bg); color: var(--oc-fg); font-family: var(--oc-font); }
      #root { padding: 16px; max-width: 960px; margin: 0 auto; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      .summary, .muted { color: var(--oc-muted); font-size: 13px; }
      .project { margin-top: 16px; padding: 12px 16px; border-radius: var(--oc-radius); background: var(--oc-muted-surface); }
      .project h2 { font-size: 14px; margin: 0; }
      .sessions { list-style: none; margin: 8px 0 0; padding: 0; }
      .sessions li { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; cursor: pointer; }
      .sessions li:hover { color: var(--oc-primary-text); }
      .badge { font-size: 12px; white-space: nowrap; }
      .running { color: var(--oc-info-text); }
      .waiting { color: var(--oc-warning-text); }
      .failed { color: var(--oc-error-text); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="main.js"></script>
  </body>
</html>
