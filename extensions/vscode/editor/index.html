<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VS Code editor</title>
    <link rel="stylesheet" href="build/main.css" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--oc-bg); color: var(--oc-fg); font-family: var(--oc-font, system-ui); }
      #app { display: flex; flex-direction: column; height: 100%; }
      #editor { flex: 1; min-height: 0; }
      #status { display: flex; align-items: center; gap: 6px; padding: 2px 10px; font-size: 11.5px; color: var(--oc-muted); border-top: 1px solid var(--oc-border); white-space: nowrap; overflow: hidden; }
      #status .sep { opacity: 0.6; }
      #status .link { background: none; border: 0; padding: 0; color: var(--oc-primary); font: inherit; cursor: pointer; }
      #status .link:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="editor"></div>
      <footer id="status" aria-live="polite">Loading VS Code's editor…</footer>
    </div>
    <script src="build/main.js"></script>
  </body>
</html>
