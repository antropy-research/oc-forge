<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VS Code</title>
    <style>
      html, body { margin: 0; background: var(--oc-bg); color: var(--oc-fg); font-family: var(--oc-font, system-ui); font-size: 13px; }
      #root { box-sizing: border-box; padding: 12px 14px 24px; max-width: 760px; }
      h1 { font-size: 16px; margin: 0 0 6px; }
      h2 { font-size: 13px; margin: 18px 0 6px; }
      .hint { color: var(--oc-muted); margin: 4px 0; line-height: 1.45; }
      .problem { color: var(--oc-error, #c92a2a); margin: 4px 0; }
      .problem:empty { display: none; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
      .row input { flex: 1; min-width: 180px; }
      input, select, button { font: inherit; color: inherit; background: var(--oc-elevated, var(--oc-bg)); border: 1px solid var(--oc-border); border-radius: var(--oc-radius, 6px); padding: 4px 8px; }
      button { cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      label { display: block; margin: 6px 0; }
      label.inline { display: flex; align-items: center; gap: 6px; }
      code { font-family: var(--oc-mono, monospace); font-size: 12px; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="main.js"></script>
  </body>
</html>
